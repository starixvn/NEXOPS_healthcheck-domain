stages:
  - generate

generate_configmap:
  # rules:
  #   - changes:
  #       - domains/**/* 
  stage: generate
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - git config --global user.name "CI Bot"
    - git config --global user.email "ci-bot@nexdev.net"


    - git worktree prune
    - rm -rf /tmp/ci-configmap || true


    - sh tools/gen-configmap.sh

    # Prepare ci-configmap branch
    - git fetch origin ci-configmap || true
    - git worktree add /tmp/ci-configmap ci-configmap || git worktree add -b ci-configmap /tmp/ci-configmap origin/main

    # Copy file từ /tmp/gen/ → /tmp/ci-configmap/k8s/
    - mkdir -p /tmp/ci-configmap/k8s
    - cp /tmp/gen/k8s/configmap.yaml /tmp/ci-configmap/k8s/configmap.yaml

    # Commit + push
    - cd /tmp/ci-configmap
    - git add k8s/configmap.yaml
    - git commit -m "ci update configmap from domains" || echo "No changes"
# Set lại origin với quyền push bằng CI_JOB_TOKEN
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.nexdev.net:NEXOPS/healthcheck-domain.git
    - git push origin ci-configmap
