stages:
  - generate

generate_configmap:
  rules:
    - changes:
        - domains/**/* 
  stage: generate
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - git config --global user.name "CI Bot"
    - git config --global user.email "ci-bot@nexdev.net"
    - sh tools/gen-configmap.sh

    # checkout another branch
    - git checkout -b ci-configmap || git checkout ci-configmap
    - git add k8s/configmap.yaml
    - git commit -m "chore(ci) update configmap" || echo "No changes"
    - git push -f origin ci-configmap
