stages:
  - generate-config-map
  - build-image

generate_configmap:
  rules:
    - changes:
        - domains/**/* 
  stage: generate-config-map
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - git config --global user.name "CI Bot"
    - git config --global user.email "ci-bot@nexdev.net"

build_push_image:
  stage: build-image
  rules:
    - changes:
        - apps/**/*
  image: hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja
  script:
    - cd apps
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p "$DOCKER_REG_PASSWORD" $DOCKER_REG_LOCAL_URL
    - docker build -t $DOCKER_REG_LOCAL_URL/base/cronjob-checkdomain:latest .
    - docker push $DOCKER_REG_LOCAL_URL/base/cronjob-checkdomain:latest

