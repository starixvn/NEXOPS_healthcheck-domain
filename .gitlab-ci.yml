stages:
  - generate

generate_configmap:
  stage: generate
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - git config --global user.name "CI Bot"
    - git config --global user.email "ci-bot@nexdev.net"
    - sh tools/gen-configmap.sh
    - git add k8s/configmap.yaml
    - git commit -m "update configmap from domain list"
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.nexdev.net/NEXOPS/healthcheck-domain.git
    - echo "🔍 CI_COMMIT_REF_NAME = $CI_COMMIT_REF_NAME"
    # - git push origin main
